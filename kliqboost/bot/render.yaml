services:
  - type: worker
    name: kliqboost-bot
    runtime: docker
    plan: professional
    dockerfilePath: ./Dockerfile
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: API_BASE_URL
        value: https://kliqboost-api.onrender.com
      - key: WEBHOOK_URL
        sync: false
      - key: STATS_SYNC_KEY
        value: "kliq-stats-2026-xK9m"
      - key: OLLAMA_CLOUD_URL
        value: https://ollama.com/v1/chat/completions
      - key: OLLAMA_MODEL
        value: kimi-k2:1t
      - key: OLLAMA_CLOUD_API_KEY
        sync: false
      - key: OLLAMA_CLOUD_KEY
        sync: false