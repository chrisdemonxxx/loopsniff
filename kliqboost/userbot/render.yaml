services:
  - type: worker
    name: kliqboost-autoresponder
    runtime: python
    plan: professional
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: TG_SESSION_B64
        sync: false
      - key: TG_API_ID
        sync: false
      - key: TG_API_HASH
        sync: false
      - key: TG_PHONE
        sync: false
      - key: TG_CLOUD_PASSWORD
        sync: false
      - key: ADMIN_BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: API_BASE_URL
        value: https://kliqboost-api.onrender.com
      - key: STATS_SYNC_KEY
        value: "kliq-stats-2026-xK9m"
      - key: OLLAMA_CLOUD_API_KEY
        sync: false
      - key: OLLAMA_CLOUD_KEY
        sync: false
      - key: OLLAMA_CLOUD_URL
        value: https://ollama.com/v1/chat/completions
      - key: OLLAMA_MODEL
        value: kimi-k2:1t
      - key: PYTHON_VERSION
        value: "3.12.0"