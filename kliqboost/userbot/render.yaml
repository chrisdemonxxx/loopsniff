services:
  - type: worker
    name: kliqboost-autoresponder
    runtime: python
    plan: professional
    buildCommand: pip install -r requirements.txt
    startCommand: python admin_autoresponder.py
    envVars:
      - key: TG_SESSION_B64
        sync: false
      - key: ADMIN_BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: API_BASE_URL
        value: https://kliqboost-api.onrender.com
      - key: OLLAMA_CLOUD_API_KEY
        sync: false