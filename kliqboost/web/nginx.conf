worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

    # Security headers (shared)
    map $uri $content_security_policy {
        default "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.kliqboost.store;";
    }

    # --- Client Portal: portal.kliqboost.store ---
    server {
        listen 80;
        server_name portal.kliqboost.store;

        # SSL placeholder — uncomment and configure with your certs
        # listen 443 ssl http2;
        # ssl_certificate     /etc/nginx/ssl/portal.kliqboost.store.crt;
        # ssl_certificate_key /etc/nginx/ssl/portal.kliqboost.store.key;
        # ssl_protocols       TLSv1.2 TLSv1.3;
        # ssl_ciphers         HIGH:!aNULL:!MD5;
        # if ($scheme = http) { return 301 https://$host$request_uri; }

        limit_req zone=general burst=20 nodelay;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # --- Admin Panel: admin.kliqboost.store ---
    server {
        listen 80;
        server_name admin.kliqboost.store;

        # SSL placeholder
        # listen 443 ssl http2;
        # ssl_certificate     /etc/nginx/ssl/admin.kliqboost.store.crt;
        # ssl_certificate_key /etc/nginx/ssl/admin.kliqboost.store.key;
        # ssl_protocols       TLSv1.2 TLSv1.3;
        # ssl_ciphers         HIGH:!aNULL:!MD5;
        # if ($scheme = http) { return 301 https://$host$request_uri; }

        limit_req zone=general burst=20 nodelay;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # --- Website: kliqboost.store ---
    server {
        listen 80;
        server_name kliqboost.store www.kliqboost.store;

        # SSL placeholder
        # listen 443 ssl http2;
        # ssl_certificate     /etc/nginx/ssl/kliqboost.store.crt;
        # ssl_certificate_key /etc/nginx/ssl/kliqboost.store.key;
        # ssl_protocols       TLSv1.2 TLSv1.3;
        # ssl_ciphers         HIGH:!aNULL:!MD5;
        # if ($scheme = http) { return 301 https://$host$request_uri; }

        limit_req zone=general burst=20 nodelay;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            proxy_pass http://127.0.0.1:3002;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # --- API: api.kliqboost.store ---
    server {
        listen 80;
        server_name api.kliqboost.store;

        # SSL placeholder
        # listen 443 ssl http2;
        # ssl_certificate     /etc/nginx/ssl/api.kliqboost.store.crt;
        # ssl_certificate_key /etc/nginx/ssl/api.kliqboost.store.key;
        # ssl_protocols       TLSv1.2 TLSv1.3;
        # ssl_ciphers         HIGH:!aNULL:!MD5;
        # if ($scheme = http) { return 301 https://$host$request_uri; }

        limit_req zone=api burst=50 nodelay;
        client_max_body_size 10M;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # WebSocket endpoints (chat)
        location /ws {
            proxy_pass http://127.0.0.1:8099;
        }

        location / {
            proxy_pass http://127.0.0.1:8099;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering on;
        }
    }
}
