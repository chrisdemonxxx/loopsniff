services:
  # ── Reverse Proxy ──────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
      client-portal:
        condition: service_started
      admin-panel:
        condition: service_started
      website:
        condition: service_started
    networks:
      - frontend
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  # ── Certbot (run on demand: `docker compose run --rm certbot ...`) ─
  certbot:
    image: certbot/certbot:latest
    profiles: ["tools"]
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

  # ── Data Stores ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kliqboost
      POSTGRES_USER: kliqboost
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kliqboost_dev}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kliqboost"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ── Backend API ────────────────────────────────────────────────
  api:
    build: ./kliqboost-api
    restart: unless-stopped
    expose:
      - "8099"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      PORT: "8099"
      DATABASE_URL: postgresql+asyncpg://kliqboost:${POSTGRES_PASSWORD:-kliqboost_dev}@postgres:5432/kliqboost
      REDIS_URL: redis://redis:6379/0
      RUN_ALEMBIC: "0"
    volumes:
      - api_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8099/health\")' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"

  # ── Frontend Services ──────────────────────────────────────────
  client-portal:
    build: ./kliqboost-client-portal
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    env_file: .env
    environment:
      PORT: "3000"
      NEXTAUTH_URL: https://portal.kliqboost.online
      API_URL: http://api:8099
      NEXT_PUBLIC_API_URL: https://api.kliqboost.online
    networks:
      - frontend
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  admin-panel:
    build: ./kliqboost-admin-panel
    restart: unless-stopped
    expose:
      - "3001"
    depends_on:
      api:
        condition: service_healthy
    env_file: .env
    environment:
      PORT: "3001"
      NEXTAUTH_URL: https://admin.kliqboost.online
      API_URL: http://api:8099
      NEXT_PUBLIC_API_URL: https://api.kliqboost.online
    networks:
      - frontend
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  website:
    build: ./kliqboost-website
    restart: unless-stopped
    expose:
      - "3002"
    env_file: .env
    environment:
      PORT: "3002"
      NEXT_PUBLIC_API_URL: https://api.kliqboost.online
    networks:
      - frontend
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

volumes:
  postgres_data:
  api_uploads:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
