# DEPRECATED — use `infra/gcp/deploy-cloud-run.sh` for production.
services:
  - type: web
    name: kliqboost-admin
    runtime: node
    plan: professional
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_URL
        value: https://api.kliqboost.online
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://admin.kliqboost.online
