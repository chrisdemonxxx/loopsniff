services:
  # ── Reverse Proxy ──────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      client-portal:
        condition: service_started
      admin-panel:
        condition: service_started
      website:
        condition: service_started
    networks:
      - frontend
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  # ── Data Stores ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: adflux
      POSTGRES_USER: adflux
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adflux_dev}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adflux"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ── Backend API ────────────────────────────────────────────────
  api:
    build: ./adflux-api
    restart: unless-stopped
    expose:
      - "8099"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://adflux:${POSTGRES_PASSWORD:-adflux_dev}@postgres:5432/adflux
      REDIS_URL: redis://redis:6379/0
    volumes:
      - api_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8099/health\")' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"

  # ── Frontend Services ──────────────────────────────────────────
  client-portal:
    build: ./adflux-client-portal
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    env_file: .env
    environment:
      NEXTAUTH_URL: http://localhost:3000
      API_URL: http://api:8099
    networks:
      - frontend
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  admin-panel:
    build: ./adflux-admin-panel
    restart: unless-stopped
    expose:
      - "3001"
    depends_on:
      api:
        condition: service_healthy
    env_file: .env
    environment:
      NEXTAUTH_URL: http://localhost:3001
      API_URL: http://api:8099
    networks:
      - frontend
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  website:
    build: ./adflux-website
    restart: unless-stopped
    expose:
      - "3002"
    networks:
      - frontend
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

volumes:
  postgres_data:
  api_uploads:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
