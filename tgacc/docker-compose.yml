services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: adflux
      POSTGRES_USER: adflux
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adflux_dev}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adflux"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: ./adflux-api
    ports: ["8099:8099"]
    depends_on:
      postgres: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://adflux:${POSTGRES_PASSWORD:-adflux_dev}@postgres:5432/adflux

  client-portal:
    build: ./adflux-client-portal
    ports: ["3000:3000"]
    depends_on: [api]
    environment:
      NEXTAUTH_URL: http://localhost:3000
      API_URL: http://api:8099

  admin-panel:
    build: ./adflux-admin-panel
    ports: ["3001:3001"]
    depends_on: [api]
    environment:
      NEXTAUTH_URL: http://localhost:3001
      API_URL: http://api:8099

  website:
    build: ./adflux-website
    ports: ["3002:3002"]

volumes:
  postgres_data:
